name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flask-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flask-backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: flask --app app:create_app db upgrade
        env:
          FLASK_DEBUG: "1"
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
          JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters
          DATABASE_URL: sqlite:///ci.sqlite3
      - run: flask --app app:create_app db check
        env:
          FLASK_DEBUG: "1"
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
          JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters
          DATABASE_URL: sqlite:///ci.sqlite3
      - run: python -m unittest discover -s tests -v
        env:
          FLASK_DEBUG: "1"
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
          JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-32-characters

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
