openapi: 3.1.0
info:
  title: Smart CRM Automation API
  version: 1.0.0
  description: Flask REST API for authentication, product enquiries, tickets, meetings, notifications, and administration.
servers:
  - url: http://localhost:8001/api/v1
    description: Local Flask development server
  - url: https://your-api-host.example/api/v1
    description: Replace with the deployed API URL
tags:
  - name: Authentication
  - name: Products
  - name: Tickets
  - name: AI Support
  - name: Feedback
  - name: Meetings
  - name: Sales
  - name: Notifications
  - name: Administration
paths:
  /feedback/public:
    get:
      tags: [Feedback]
      security: []
      summary: List approved public reviews and approved-only rating summary
      description: Obvious email addresses, credential labels with values, and JWT-shaped strings are redacted from public output. Rate limited to 60 requests per minute.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: rating
          schema: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200":
          description: Approved reviews only. Public results contain no customer ID or email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  average_rating: { type: [number, "null"] }
                  total_reviews: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: [string, "null"] }
                        comment: { type: string }
                        rating: { type: integer, minimum: 1, maximum: 5 }
                        display_name: { type: string }
                        created_at: { type: string, format: date-time }
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /feedback:
    post:
      tags: [Feedback]
      security: [{ bearerAuth: [] }]
      summary: Submit customer feedback for moderation
      description: Requires an authenticated CUSTOMER. The customer ID is taken from the JWT, never from the request body. Obvious email addresses and credentials are rejected. Rate limited to 10 submissions per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 120 }
                comment: { type: string, minLength: 1, maxLength: 3000 }
                display_name: { type: [string, "null"], maxLength: 80 }
      responses:
        "201": { description: Feedback submitted with pending status }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /feedback/mine:
    get:
      tags: [Feedback]
      security: [{ bearerAuth: [] }]
      summary: List the authenticated customer's own feedback submissions and statuses
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200": { description: Paginated submissions belonging only to the caller }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/feedback:
    get:
      tags: [Feedback]
      security: [{ bearerAuth: [] }]
      summary: List reviews for the Main Admin moderation queue
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, all], default: pending }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200": { description: Paginated moderation results with privacy-safe author labels }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/feedback/{review_id}:
    patch:
      tags: [Feedback]
      security: [{ bearerAuth: [] }]
      summary: Approve or reject a review without changing its text
      parameters:
        - in: path
          name: review_id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
      responses:
        "200": { description: Updated moderation status and timestamp }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /ai-support/health:
    get:
      tags: [AI Support]
      security: [{ bearerAuth: [] }]
      summary: Check local AI Support availability
      responses:
        "200": { description: Ollama and the configured models are available }
        "401": { $ref: "#/components/responses/Error" }
        "503": { description: Local AI Support is unavailable }
  /ai-support/chat:
    post:
      tags: [AI Support]
      security: [{ bearerAuth: [] }]
      summary: Ask a question grounded in approved public support information
      description: Rate limited to 15 requests per minute. Conversation history is request-scoped and is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                history:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Answer, source references, or a human-support handoff recommendation
          content:
            application/json:
              schema:
                type: object
                required: [answer, sources, needs_human_support]
                properties:
                  answer: { type: string }
                  sources:
                    type: array
                    items:
                      type: object
                      required: [title, relevance]
                      properties:
                        title: { type: string }
                        relevance: { type: number }
                  needs_human_support: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /health:
    get:
      summary: Check API and database liveness
      responses:
        "200":
          description: API and database are available
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 160 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "201": { description: Account created and ready to sign in }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address using its signed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Email verified }
        "400": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                required: [access, refresh, user]
                properties:
                  access: { type: string }
                  refresh: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/token/refresh/:
    post:
      tags: [Authentication]
      summary: Rotate the refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        "200": { description: New access and refresh token pair }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Revoke current session tokens
      responses:
        "200": { description: Session revoked }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password-reset:
    post:
      tags: [Authentication]
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Generic response; does not disclose account existence }
  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Set a new password with a time-limited token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "200": { description: Password updated; old tokens revoked }
        "400": { $ref: "#/components/responses/Error" }
  /auth/me:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Get the signed-in user
      responses:
        "200": { description: User profile }
        "401": { $ref: "#/components/responses/Error" }
  /products:
    get:
      tags: [Products]
      summary: Browse active products
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200": { description: Product list }
    post:
      tags: [Products]
      security: [{ bearerAuth: [] }]
      summary: Create a product (Main Admin)
      responses:
        "201": { description: Product created }
        "403": { $ref: "#/components/responses/Error" }
  /products/{product_id}:
    parameters:
      - in: path
        name: product_id
        required: true
        schema: { type: integer }
    patch:
      tags: [Products]
      security: [{ bearerAuth: [] }]
      summary: Update product (Main Admin)
      responses:
        "200": { description: Product updated }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Products]
      security: [{ bearerAuth: [] }]
      summary: Delete an unused product (Main Admin)
      responses:
        "204": { description: Product deleted }
        "409": { $ref: "#/components/responses/Error" }
  /tickets:
    get:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      summary: Search tickets visible to the signed-in user
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [NEW, ASSIGNED, IN_PROGRESS, MEETING_SCHEDULED, RESOLVED, CLOSED] }
        - in: query
          name: priority
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated ticket list; Main Admin can read ticket overview fields but cannot access conversations or attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object } }
                  page: { type: integer }
                  per_page: { type: integer }
                  total: { type: integer }
                  pages: { type: integer }
                  status_counts:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      summary: Customer creates a ticket; auto-routes by category
      description: Customer-created tickets use Medium priority. Staff in the assigned department handle status and priority updates; Main Admin can read ticket overviews and details but cannot update tickets.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
      responses:
        "201": { description: Ticket created and routed }
        "400": { $ref: "#/components/responses/Error" }
  /leads/enquiry:
    post:
      tags: [Sales, Tickets]
      security: [{}, { bearerAuth: [] }]
      summary: Submit a sales enquiry or signed-in customer support request
      description: Sales submissions deduplicate active leads by normalized email while preserving every enquiry. The assigned Sales Manager can see and verify new enquiries, then submit them for Main Admin approval. Support requests create a routed ticket without creating a lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                type: { type: string, enum: [sales_enquiry, support_request], default: sales_enquiry }
                contact_name: { type: string, maxLength: 160 }
                name: { type: string, maxLength: 160 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 40 }
                company: { type: string, maxLength: 180 }
                product_id: { type: integer }
                message: { type: string, maxLength: 20000 }
                source: { type: string, maxLength: 40 }
                subject: { type: string, maxLength: 240 }
                issue_category: { type: string, enum: [PRODUCT_DEFECT, TECHNICAL_SUPPORT] }
      responses:
        "201": { description: Sales enquiry recorded or support ticket created }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tickets/{ticket_id}:
    parameters:
      - in: path
        name: ticket_id
        required: true
        schema: { type: string, description: Database id or ticket number }
    get:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      summary: Read ticket details; Main Admin cannot access conversations or attachments
      responses:
        "200": { description: Ticket details }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      summary: Update status/priority as staff in the ticket's department; Main Admin is read-only
      responses:
        "200": { description: Ticket updated }
        "403": { $ref: "#/components/responses/Error" }
  /tickets/{ticket_id}/comments:
    post:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      summary: Add a customer or staff ticket conversation message; Main Admin cannot access conversations
      responses:
        "201": { description: Comment added }
  /tickets/{ticket_id}/documents:
    post:
      tags: [Tickets]
      security: [{ bearerAuth: [] }]
      summary: Upload an allow-listed ticket attachment
      description: Main Admin cannot access ticket attachments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Attachment saved }
        "413": { $ref: "#/components/responses/Error" }
  /meetings:
    get:
      tags: [Meetings]
      security: [{ bearerAuth: [] }]
      summary: List meetings visible to the caller; Main Admin sees lead meetings only
      parameters:
        - in: query
          name: upcoming
          schema: { type: boolean, default: false }
          description: When true, return only meetings that have not started yet.
      responses:
        "200": { description: Meeting list }
    post:
      tags: [Meetings]
      security: [{ bearerAuth: [] }]
      summary: Schedule a future Jitsi meeting for an accessible ticket (staff)
      description: Main Admin can schedule lead meetings but cannot access ticket meetings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_id, starts_at]
              properties:
                ticket_id: { type: integer }
                starts_at: { type: string, format: date-time }
                duration_minutes: { type: integer, minimum: 5, maximum: 480, default: 30 }
      responses:
        "201": { description: Meeting and Jitsi link created }
  /leads:
    get:
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      summary: List leads assigned to the Sales Manager or all leads for Main Admin
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [NEW, UNDER_REVIEW, CONTACTED, INTERESTED, QUALIFIED, PURCHASE_PENDING, CONVERTED, LOST, DISQUALIFIED] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated sales leads assigned to the manager (including leads awaiting verification) or all leads for Main Admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object } }
                  total: { type: integer }
                  page: { type: integer }
                  pages: { type: integer }
                  status_counts:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      summary: Create a lead assigned to a Sales Manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_name, email]
              properties:
                contact_name: { type: string, maxLength: 160 }
                email: { type: string, format: email }
                company: { type: string, maxLength: 180 }
                phone: { type: string, maxLength: 40 }
                product_id: { type: integer, nullable: true }
                notes: { type: string, maxLength: 5000 }
      responses:
        "201": { description: Lead created }
        "400": { $ref: "#/components/responses/Error" }
  /leads/{lead_id}:
    parameters:
      - in: path
        name: lead_id
        required: true
        schema: { type: integer }
    patch:
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      summary: Update lead status or notes
      responses:
        "200": { description: Lead updated }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /leads/{lead_id}/verify:
    post:
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      summary: Submit a Sales Manager-verified lead for Main Admin approval
      parameters:
        - in: path
          name: lead_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_notes]
              properties:
                verification_notes: { type: string, minLength: 1, maxLength: 5000 }
                product_id: { type: integer }
      responses:
        "200": { description: Lead submitted and Main Admin notified }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /leads/{lead_id}/convert:
    post:
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      summary: Convert a lead to a customer account and Sales-routed product enquiry ticket
      responses:
        "201": { description: Customer account ready to sign in and Sales-routed ticket created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /leads/{lead_id}/verify-purchase:
    post:
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      summary: Confirm purchase intent and verify the customer's purchase
      parameters:
        - in: path
          name: lead_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_intent]
              properties:
                purchase_intent: { type: string, enum: [YES] }
                purchase_verification_notes: { type: string, maxLength: 5000, description: Optional note; if omitted, the API records the verifying user's confirmation. }
      responses:
        "200": { description: Purchase intent and evidence recorded }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /leads/{lead_id}/enquiries:
    get:
      tags: [Sales]
      security: [{ bearerAuth: [] }]
      summary: List enquiry records visible to the assigned sales, support, or admin user
      responses:
        "200": { description: Enquiry history }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: List the signed-in user's notifications
      responses:
        "200": { description: Notifications }
  /notifications/{notification_id}/read:
    post:
      tags: [Notifications]
      security: [{ bearerAuth: [] }]
      summary: Mark an owned notification read
      responses:
        "200": { description: Notification updated }
        "404": { $ref: "#/components/responses/Error" }
  /admin/dashboard:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Organization ticket/team analytics (Main Admin)
      responses:
        "200": { description: Counts, trends, meetings, priorities and team workload }
        "403": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: List users (Main Admin)
      responses:
        "200": { description: User list }
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Provision a team member (Main Admin)
      responses:
        "201": { description: Team account created }
  /admin/departments:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: List teams (Main Admin)
      responses:
        "200": { description: Department list }
    post:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Create a team (Main Admin)
      responses:
        "201": { description: Department created }
  /admin/reports/tickets.csv:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Export CSV ticket report
      responses:
        "200": { description: CSV report }
  /admin/reports/tickets.xlsx:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Export Excel ticket report
      responses:
        "200": { description: XLSX report }
  /admin/reports/tickets.pdf:
    get:
      tags: [Administration]
      security: [{ bearerAuth: [] }]
      summary: Export PDF ticket report
      responses:
        "200": { description: PDF report }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    User:
      type: object
      required: [id, name, email, role, email_verified, is_active]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        department: { type: [string, "null"] }
        email_verified: { type: boolean }
        is_active: { type: boolean }
    TicketCreate:
      type: object
      required: [issue_category, subject, description]
      properties:
        issue_category:
          type: string
          enum: [PRODUCT_ENQUIRY, PRODUCT_DEFECT, TECHNICAL_SUPPORT]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          default: MEDIUM
        subject: { type: string, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        product_id: { type: [integer, "null"] }
